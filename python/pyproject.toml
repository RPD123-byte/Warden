[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-hook-sdk"
version = "0.1.0"
description = "Python SDK and worker protocol for local Warden hooks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
warden-hook-worker = "warden.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
