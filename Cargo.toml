[package]
name = "warden-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace]
resolver = "2"
members = ["crates/warden-agent"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
codex-control = { git = "https://github.com/RPD123-byte/Warden.git", rev = "8f2f5bf9de97ddaea66974eeba1cc82382423277", package = "codex-control" }
dirs = "6.0"
fs2 = "0.4"
hex = "0.4"
notify = "8.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
warden-agent = { path = "crates/warden-agent" }

[dev-dependencies]
tempfile = "3.23"
transport = { git = "https://github.com/RPD123-byte/Warden.git", rev = "8f2f5bf9de97ddaea66974eeba1cc82382423277" }

[[bin]]
name = "warden-daemon"
path = "src/main.rs"

[[bin]]
name = "warden"
path = "src/bin/warden.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
