[package]
name = "warden-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Managed Claude Code and Codex CLI sessions for Warden hooks"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
